version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bighammer_user
      POSTGRES_PASSWORD: bighammer_password
      POSTGRES_DB: bighammer_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./rag-app-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://bighammer_user:bighammer_password@db:5432/bighammer_rag
      - GEMINI_API_KEY=${GEMINI_API_KEY:-YOUR_API_KEY_HERE}
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - db
    volumes:
      - ./rag-app-backend:/app

  frontend:
    build: ./rag-app-frontend
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./rag-app-frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
